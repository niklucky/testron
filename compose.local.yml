services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testron
      POSTGRES_USER: testron
      POSTGRES_PASSWORD: testron
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testron -d testron']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./tmp/db:/var/lib/postgresql/data

