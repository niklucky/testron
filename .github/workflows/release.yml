name: Release

# Desktop distributables. Push a `v*` tag to publish them; a manual run builds
# the same four targets without touching releases, which is how a packaging
# change gets checked before it is tagged.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
            asset: Testron-macos-arm64.zip
          - os: macos-15
            platform: darwin
            arch: x64
            asset: Testron-macos-x64.zip
          - os: windows-latest
            platform: win32
            arch: x64
            asset: Testron-windows-x64.zip
          - os: ubuntu-latest
            platform: linux
            arch: x64
            asset: Testron-linux-x64.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Import Apple code-signing certificate
        if: matrix.platform == 'darwin'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          : "${MACOS_CERTIFICATE:?Add the base64-encoded Developer ID Application certificate as the MACOS_CERTIFICATE secret.}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Add the certificate export password as the MACOS_CERTIFICATE_PASSWORD secret.}"

          certificate_path="$RUNNER_TEMP/testron-developer-id.p12"
          keychain_path="$RUNNER_TEMP/testron-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
      - name: Make signed and notarized macOS distributable
        if: matrix.platform == 'darwin'
        run: pnpm --filter @testron/desktop exec electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
        env:
          # The packaged app talks to the hosted server; the site tells people
          # the same address.
          TESTRON_SERVER_URL: ${{ vars.TESTRON_PUBLIC_URL || 'https://app.testron.dev' }}
          MACOS_SIGNING_ENABLED: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Make distributable
        if: matrix.platform != 'darwin'
        run: pnpm --filter @testron/desktop exec electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
        env:
          TESTRON_SERVER_URL: ${{ vars.TESTRON_PUBLIC_URL || 'https://app.testron.dev' }}
      - name: Verify signed and notarized macOS app
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          app="apps/desktop/out/Testron-${{ matrix.platform }}-${{ matrix.arch }}/Testron.app"
          codesign --verify --deep --strict --verbose=4 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
      - name: Name the artifact
        shell: bash
        # Forge stamps the package version into the file name. The site links to
        # `releases/latest/download/<asset>`, so the published name has to be
        # stable across versions.
        run: |
          mkdir -p dist
          # Scoped to this target's own directory: `out/make` accumulates the
          # artifacts of every earlier build, which matters the moment anyone
          # runs this locally.
          made=apps/desktop/out/make/zip/${{ matrix.platform }}/${{ matrix.arch }}
          built=$(find "$made" -name '*.zip' -type f | head -n 1)
          if [ -z "$built" ]; then
            echo "No distributable was produced in $made." >&2
            exit 1
          fi
          mv "$built" "dist/${{ matrix.asset }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
      - name: Delete temporary signing keychain
        if: always() && matrix.platform == 'darwin'
        shell: bash
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/testron-developer-id.p12"

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" dist/*.zip
