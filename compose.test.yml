name: testron-tests

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testron_test
      POSTGRES_USER: testron_test
      POSTGRES_PASSWORD: testron_test
    ports:
      - '127.0.0.1:55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testron_test -d testron_test']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
