server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.testron.dev;
    ssl_certificate /etc/letsencrypt/live/app.testron.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.testron.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512M;

    location = /slang/api/translations {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/testron-slang.conf;
    }

    location = /slang/api/translations/state {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/testron-slang.conf;
    }

    location /slang/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }
}
