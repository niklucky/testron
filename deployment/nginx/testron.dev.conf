server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __WEB_NAMES__;
    ssl_certificate /etc/letsencrypt/live/testron.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testron.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/testron.dev/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
